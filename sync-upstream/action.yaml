name: Sync Upstream
description: >
  Syncs a downstream fork with an upstream repository release.
  Detects the latest upstream release tag (or accepts an explicit ref),
  pushes it as a branch, and creates a PR for review.

inputs:
  token:
    description: 'GitHub token with contents write + pull-requests write'
    required: true
  upstream_repo:
    description: 'Upstream repository URL (e.g., https://github.com/sigstore/rekor)'
    required: true
  upstream_ref:
    description: 'Upstream ref to merge (tag or branch). If empty, auto-detects latest release tag.'
    required: false
    default: ''
  target_branch:
    description: 'Downstream branch to merge into (e.g., main)'
    required: true
  resolve_conflicts:
    description: 'Auto-resolve known merge conflict patterns (true/false)'
    required: false
    default: 'true'
  go_version_ceiling_image:
    description: 'Container image that determines max Go version (e.g., registry.redhat.io/ubi9/go-toolset:latest)'
    required: false
    default: 'registry.redhat.io/ubi9/go-toolset:latest'
  go_version_ceiling:
    description: 'Explicit Go version ceiling override (e.g., 1.26.2). If set, skips Pyxis API lookup.'
    required: false
    default: ''
  downstream_only_files:
    description: 'Newline-separated list of files to always restore from target branch after merge'
    required: false
    default: ''
  take_upstream_patterns:
    description: >
      Newline-separated list of grep -E patterns for conflicting files that should be
      auto-resolved by taking upstream (HEAD) content.
      Default includes CHANGELOG files. Add patterns like '\.pb\.go$' for generated protobuf.
    required: false
    default: '(^|/)CHANGELOG'
  take_downstream_patterns:
    description: >
      Newline-separated list of grep -E patterns for conflicting files that should be
      auto-resolved by taking downstream (target branch) content.
      Example: 'testdata/' to keep downstream test fixtures.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Derive upstream owner/repo
      id: upstream-info
      run: |
        REPO_URL="${UPSTREAM_REPO}"
        REPO_URL="${REPO_URL%.git}"
        REPO_URL="${REPO_URL%/}"
        REPO_URL="${REPO_URL#https://github.com/}"
        REPO_URL="${REPO_URL#/}"
        if ! echo "$REPO_URL" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
          echo "::error::Invalid upstream_repo: could not derive owner/repo from '${UPSTREAM_REPO}'"
          exit 1
        fi
        echo "owner_repo=$REPO_URL" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}

    - name: Detect latest upstream release
      id: detect-release
      if: inputs.upstream_ref == ''
      run: |
        LATEST_TAG=$(gh api "repos/${OWNER_REPO}/releases/latest" --jq '.tag_name')
        if [ -z "$LATEST_TAG" ]; then
          echo "::error::No releases found for ${OWNER_REPO}"
          exit 1
        fi
        echo "ref=$LATEST_TAG" >> "$GITHUB_OUTPUT"
        echo "Detected latest upstream release: $LATEST_TAG"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER_REPO: ${{ steps.upstream-info.outputs.owner_repo }}

    - name: Set upstream ref
      id: upstream-ref
      run: |
        REF="${EXPLICIT_REF:-$DETECTED_REF}"
        if [ -z "$REF" ]; then
          echo "::error::No upstream ref resolved"
          exit 1
        fi
        echo "ref=$REF" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        EXPLICIT_REF: ${{ inputs.upstream_ref }}
        DETECTED_REF: ${{ steps.detect-release.outputs.ref }}

    - name: Checkout downstream repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.target_branch }}
        fetch-depth: 0
        token: ${{ inputs.token }}

    - name: Check if already up-to-date
      id: check-uptodate
      run: |
        git remote add upstream "https://github.com/${OWNER_REPO}.git"
        git fetch upstream "$UPSTREAM_REF"

        UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)
        if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
          echo "Already up-to-date with upstream $UPSTREAM_REF"
          echo "uptodate=true" >> "$GITHUB_OUTPUT"
        else
          echo "Upstream $UPSTREAM_REF ($UPSTREAM_SHA) has new changes"
          echo "uptodate=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        OWNER_REPO: ${{ steps.upstream-info.outputs.owner_repo }}
        UPSTREAM_REF: ${{ steps.upstream-ref.outputs.ref }}

    - name: Create sync branch locally
      if: steps.check-uptodate.outputs.uptodate == 'false'
      id: push
      run: |
        SAFE_REF="${UPSTREAM_REF//[^a-zA-Z0-9._-]/-}"
        SYNC_BRANCH="sync-upstream/${TARGET_BRANCH}/${SAFE_REF}"

        echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

        # Dereference tag to commit and create local branch (no push yet)
        UPSTREAM_COMMIT=$(git rev-parse FETCH_HEAD^{commit})
        git checkout -B "$SYNC_BRANCH" "$UPSTREAM_COMMIT"
      shell: bash
      env:
        UPSTREAM_REF: ${{ steps.upstream-ref.outputs.ref }}
        TARGET_BRANCH: ${{ inputs.target_branch }}

    - name: Setup Go
      if: steps.check-uptodate.outputs.uptodate == 'false' && inputs.resolve_conflicts == 'true'
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: false

    - name: Merge, resolve conflicts, and push
      id: merge
      if: steps.check-uptodate.outputs.uptodate == 'false'
      run: bash "${GITHUB_ACTION_PATH}/resolve-conflicts.sh"
      shell: bash
      env:
        SYNC_BRANCH: ${{ steps.push.outputs.sync_branch }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        RESOLVE_CONFLICTS: ${{ inputs.resolve_conflicts }}
        GO_CEILING_IMAGE: ${{ inputs.go_version_ceiling_image }}
        GO_CEILING_OVERRIDE: ${{ inputs.go_version_ceiling }}
        DOWNSTREAM_ONLY_FILES: ${{ inputs.downstream_only_files }}
        TAKE_UPSTREAM_PATTERNS: ${{ inputs.take_upstream_patterns }}
        TAKE_DOWNSTREAM_PATTERNS: ${{ inputs.take_downstream_patterns }}
        UPSTREAM_REF: ${{ steps.upstream-ref.outputs.ref }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Generate PR body
      if: always() && steps.check-uptodate.outputs.uptodate == 'false'
      id: pr-body
      run: |
        COMMIT_LOG=$(git log --oneline -50 "origin/${TARGET_BRANCH}..FETCH_HEAD")
        COMMIT_COUNT=$(git rev-list --count "origin/${TARGET_BRANCH}..FETCH_HEAD")

        DELIMITER=$(openssl rand -hex 16)
        {
          echo "body<<${DELIMITER}"
          echo "## Upstream Sync: \`${UPSTREAM_REF}\` into \`${TARGET_BRANCH}\`"
          echo ""
          echo "Merges upstream [${OWNER_REPO}@${UPSTREAM_REF}](https://github.com/${OWNER_REPO}/releases/tag/${UPSTREAM_REF}) into \`${TARGET_BRANCH}\`."
          echo ""
          echo "### Upstream Changes (${COMMIT_COUNT} commits)"
          echo ""
          if [ "$COMMIT_COUNT" -gt 50 ]; then
            echo "Showing first 50 of ${COMMIT_COUNT} commits:"
            echo ""
          fi
          echo '```'
          echo "$COMMIT_LOG"
          echo '```'

          if [ -f /tmp/unresolved-conflicts.txt ]; then
            echo ""
            echo "### :warning: Unresolved conflicts"
            echo ""
            echo "The following files need manual resolution:"
            echo ""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- \`${f}\`"
            done < /tmp/unresolved-conflicts.txt
            echo ""
            echo "#### Resolve locally"
            echo ""
            echo '```bash'
            echo "git fetch origin"
            echo "git checkout ${SYNC_BRANCH}"
            echo "git merge origin/${TARGET_BRANCH}"
            echo ""
            echo "# Auto-resolve Dockerfiles, go.mod, and workflow version bumps"
            echo "go install github.com/securesign/actions/sync-upstream/resolve-conflicts@main"
            echo "resolve-conflicts all"
            echo ""

            if [ -s /tmp/resolved-take-upstream.txt ]; then
              echo "# Take upstream content"
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "git checkout --ours $f && git add $f"
              done < /tmp/resolved-take-upstream.txt
              echo ""
            fi

            if [ -s /tmp/resolved-take-downstream.txt ]; then
              echo "# Take downstream content"
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "git checkout --theirs $f && git add $f"
              done < /tmp/resolved-take-downstream.txt
              echo ""
            fi

            echo "# Resolve remaining conflicts manually"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "# $f"
            done < /tmp/unresolved-conflicts.txt
            echo ""
            echo "git add -A && git commit"
            echo "git push origin ${SYNC_BRANCH}"
            echo '```'
          fi

          if [ -s /tmp/go-mod-tidy-failed.txt ]; then
            echo ""
            echo "### :warning: \`go mod tidy\` failures"
            echo ""
            echo "The following modules failed \`go mod tidy\` and need manual fix:"
            echo ""
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              echo "- \`${d}/\`"
            done < /tmp/go-mod-tidy-failed.txt
            echo ""
            echo '```bash'
            echo "git checkout ${SYNC_BRANCH}"
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              echo "(cd ${d} && go mod tidy)"
            done < /tmp/go-mod-tidy-failed.txt
            echo "git add -A && git commit --amend --no-edit && git push -f origin ${SYNC_BRANCH}"
            echo '```'
          fi

          echo ""
          echo "---"
          echo "*Generated by [Sync Upstream](https://github.com/securesign/actions) action*"
          echo "${DELIMITER}"
        } >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        UPSTREAM_REF: ${{ steps.upstream-ref.outputs.ref }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        OWNER_REPO: ${{ steps.upstream-info.outputs.owner_repo }}
        SYNC_BRANCH: ${{ steps.push.outputs.sync_branch }}

    - name: Check for existing sync PR
      if: always() && steps.check-uptodate.outputs.uptodate == 'false'
      id: existing-pr
      run: |
        # Check for both open and merged PRs to avoid duplicate PRs
        EXISTING_PR_DATA=$(gh pr list --repo "$GH_REPO" --state all --head "$SYNC_BRANCH" --limit 1 --json number,state --jq '.[0] // empty')

        if [ -n "$EXISTING_PR_DATA" ]; then
          EXISTING_PR=$(echo "$EXISTING_PR_DATA" | jq -r '.number')
          EXISTING_STATE=$(echo "$EXISTING_PR_DATA" | jq -r '.state')

          if [ "$EXISTING_STATE" = "MERGED" ]; then
            echo "::notice::PR #${EXISTING_PR} for branch ${SYNC_BRANCH} was already merged. Skipping duplicate PR creation."
            echo "skip_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
          echo "skip_pr=false" >> "$GITHUB_OUTPUT"
        else
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "skip_pr=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        SYNC_BRANCH: ${{ steps.push.outputs.sync_branch }}

    - name: Create or update PR
      if: always() && steps.check-uptodate.outputs.uptodate == 'false' && steps.existing-pr.outputs.skip_pr != 'true'
      run: |
        PR_TITLE="[Upstream Sync] Merge ${UPSTREAM_REF} into ${TARGET_BRANCH}"

        if [ -n "$EXISTING_PR" ]; then
          echo "Updating existing PR #${EXISTING_PR}"
          gh pr edit "$EXISTING_PR" --repo "$GH_REPO" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"
        else
          echo "Creating new PR"
          gh pr create --repo "$GH_REPO" \
            --base "$TARGET_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label "kind/sync-fork-to-upstream"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        UPSTREAM_REF: ${{ steps.upstream-ref.outputs.ref }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        SYNC_BRANCH: ${{ steps.push.outputs.sync_branch }}
        EXISTING_PR: ${{ steps.existing-pr.outputs.pr_number }}
        PR_BODY: ${{ steps.pr-body.outputs.body }}

    - name: Summary
      if: always() && steps.check-uptodate.outcome == 'success'
      run: |
        if [ "$UPTODATE" = "true" ]; then
          echo "### :white_check_mark: Already up-to-date" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch \`${TARGET_BRANCH}\` already contains upstream \`${UPSTREAM_REF}\`." >> "$GITHUB_STEP_SUMMARY"
        elif [ "$SKIP_PR" = "true" ]; then
          echo "### :white_check_mark: Already synced" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream \`${UPSTREAM_REF}\` was already merged to \`${TARGET_BRANCH}\` in a previous PR. Skipped duplicate PR creation." >> "$GITHUB_STEP_SUMMARY"
        elif [ "$MERGE_OUTCOME" = "success" ]; then
          echo "### :white_check_mark: Sync PR created" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream \`${UPSTREAM_REF}\` → \`${TARGET_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
        elif [ "$MERGE_OUTCOME" = "failure" ] && [ -f /tmp/unresolved-conflicts.txt ]; then
          echo "### :warning: Upstream sync needs manual resolution" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A PR has been created with resolution instructions in the description." >> "$GITHUB_STEP_SUMMARY"
        elif [ "$MERGE_OUTCOME" = "failure" ] && [ -s /tmp/go-mod-tidy-failed.txt ]; then
          echo "### :warning: Upstream sync PR created but \`go mod tidy\` failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See PR description for affected modules and fix instructions." >> "$GITHUB_STEP_SUMMARY"
        fi
      shell: bash
      env:
        UPSTREAM_REF: ${{ steps.upstream-ref.outputs.ref }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        UPTODATE: ${{ steps.check-uptodate.outputs.uptodate }}
        SKIP_PR: ${{ steps.existing-pr.outputs.skip_pr }}
        MERGE_OUTCOME: ${{ steps.merge.outcome }}
